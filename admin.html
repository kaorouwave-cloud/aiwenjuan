<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KOMI｜问卷后台</title>
  <style>
    :root { --ink:#171717; --paper:#f4f0e7; --card:#fffdf8; --line:#d7d0c3; --red:#b84735; --blue:#234e70; --muted:#706d66; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { width:min(100% - 34px, 1080px); margin:auto; padding:32px 0 70px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; }
    .brand { font-weight:850; letter-spacing:.15em; } .sub { margin-top:4px; color:var(--muted); font-size:12px; letter-spacing:.12em; }
    h1 { margin:0; font:500 clamp(35px,5vw,58px)/1 Georgia,serif; letter-spacing:-.05em; } h1 em { color:var(--blue); font-style:normal; }
    .panel,.issue { border:1px solid var(--line); background:var(--card); box-shadow:0 12px 30px #211b1010; }
    .panel { padding:20px; margin-bottom:20px; } .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
    label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; } input { width:100%; padding:11px 12px; border:1px solid #c9c1b3; border-radius:0; background:#fff; font:inherit; outline:0; } input:focus { border-color:var(--blue); box-shadow:3px 3px #234e7020; }
    .actions { display:flex; align-items:end; gap:10px; margin-top:15px; } button { padding:11px 15px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; font:inherit; } button.secondary { background:transparent; color:var(--ink); }
    .status { min-height:20px; margin:12px 0 0; color:var(--muted); font-size:12px; } .status.error { color:var(--red); }
    .issue { padding:20px; margin-bottom:12px; } .issue h2 { margin:0 0 8px; font-size:17px; } .issue h2 a { color:inherit; text-decoration:none; } .issue h2 a:hover { color:var(--blue); text-decoration:underline; }
    .meta { display:flex; flex-wrap:wrap; gap:8px 16px; color:var(--muted); font-size:12px; } .tag { display:inline-block; padding:3px 8px; background:#eee8dd; color:#504c45; font-size:11px; }
    pre { margin:15px 0 0; padding:13px; white-space:pre-wrap; background:#f7f4ed; border-left:3px solid var(--blue); color:#3e3b35; font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; max-height:320px; overflow:auto; }
    .empty { padding:30px; text-align:center; color:var(--muted); border:1px dashed var(--line); }
    .security { margin-top:15px; color:var(--muted); font-size:12px; } .security strong { color:var(--red); }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } header { display:block; } h1 { margin-top:16px; } .actions { display:block; } .actions button { width:100%; margin-top:8px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><div class="brand">KOMI</div><div class="sub">企业 AI 落地 / ADMIN</div></div><h1>问卷<em>后台</em></h1></header>
    <section class="panel">
      <div class="grid">
        <div><label for="owner">GitHub 用户或组织</label><input id="owner" placeholder="例如：komi-ai" /></div>
        <div><label for="repo">私有仓库名称</label><input id="repo" placeholder="例如：komi-questionnaire" /></div>
        <div><label for="token">Fine-grained Token</label><input id="token" type="password" placeholder="只在本页使用，不会保存" /></div>
      </div>
      <div class="actions"><button id="load">加载问卷</button><button class="secondary" id="clear">清空</button></div>
      <p class="security"><strong>安全提示：</strong>仓库必须是 Private；Token 需要该仓库 Issues 的 Read-only 权限（修改状态则需要 Read and write）。关闭页面后 Token 会从内存中消失。</p>
      <p class="status" id="status"></p>
    </section>
    <section id="results"><div class="empty">输入仓库信息后加载问卷。</div></section>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id); const status = $('status'); const results = $('results');
      const api = async (path, options = {}) => { const response = await fetch(`https://api.github.com/repos/${encodeURIComponent($('owner').value.trim())}/${encodeURIComponent($('repo').value.trim())}${path}`, { ...options, headers: { Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', Authorization:`Bearer ${$('token').value.trim()}`, ...(options.headers || {}) } }); const payload = await response.json().catch(() => ({})); if (!response.ok) throw new Error(payload.message || `GitHub 请求失败（${response.status}）`); return payload; };
      const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const render = (issues) => { if (!issues.length) { results.innerHTML = '<div class="empty">暂未找到问卷记录。</div>'; return; } results.innerHTML = issues.map((issue) => `<article class="issue"><h2><a href="${esc(issue.html_url)}" target="_blank" rel="noreferrer">${esc(issue.title)}</a></h2><div class="meta"><span>#${issue.number}</span><span>${new Date(issue.created_at).toLocaleString('zh-CN')}</span><span>${issue.state === 'open' ? '待跟进' : '已归档'}</span>${issue.labels.map((label) => `<span class="tag">${esc(label.name)}</span>`).join('')}</div><pre>${esc(issue.body)}</pre><div class="actions"><button class="secondary" data-issue="${issue.number}" data-state="${issue.state === 'open' ? 'closed' : 'open'}">${issue.state === 'open' ? '标记已跟进' : '重新打开'}</button></div></article>`).join(''); results.querySelectorAll('[data-issue]').forEach((button) => button.addEventListener('click', async () => { button.disabled = true; try { await api(`/issues/${button.dataset.issue}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ state:button.dataset.state }) }); await load(); } catch (error) { status.textContent = error.message; status.className = 'status error'; button.disabled = false; } })); };
      const load = async () => { status.className='status'; status.textContent='正在加载…'; try { const issues = await api('/issues?state=all&labels=questionnaire&per_page=100'); const records = issues.filter((issue) => !issue.pull_request); render(records); status.textContent = `共 ${records.length} 条问卷记录`; } catch (error) { status.textContent = error.message; status.className='status error'; results.innerHTML='<div class="empty">加载失败，请检查仓库、Token 和权限。</div>'; } };
      $('load').addEventListener('click', load); $('clear').addEventListener('click', () => { $('token').value=''; results.innerHTML='<div class="empty">输入仓库信息后加载问卷。</div>'; status.textContent=''; });
    })();
  </script>
</body>
</html>
